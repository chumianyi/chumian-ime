name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Create keystore
        run: |
          cd android
          keytool -genkey -v -keystore chumian.keystore -alias chumian -keyalg RSA -keysize 2048 -validity 10000 -storepass chumian123 -keypass chumian123 -dname "CN=Chumian, OU=Chumian, O=Chumian, L=Chumian, ST=Chumian, C=CN"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chumian-ime-apk
          path: build/app/outputs/flutter-apk/*.apk
